services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cardiac-backend
    restart: unless-stopped
    environment:
      - PORT=8000
      - DATABRICKS_TOKEN=${DATABRICKS_TOKEN}
      - DATABRICKS_SQL_HOST=${DATABRICKS_SQL_HOST:-}
      - DATABRICKS_SQL_PATH=${DATABRICKS_SQL_PATH:-}
      - DATABRICKS_SQL_TOKEN=${DATABRICKS_SQL_TOKEN:-}
      - DATABRICKS_CATALOG=${DATABRICKS_CATALOG:-databricks_service_pf}
      - DATABRICKS_SCHEMA=${DATABRICKS_SCHEMA:-gold}
      - DATABRICKS_ENDPOINT_URL=${DATABRICKS_ENDPOINT_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - cardiac
      - dokploy-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cardiac-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cardiac
      - dokploy-network

networks:
  cardiac:
    driver: bridge
  dokploy-network:
    external: true
