services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cardiac-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABRICKS_TOKEN=${DATABRICKS_TOKEN}
      - DATABRICKS_SQL_HOST=${DATABRICKS_SQL_HOST:-}
      - DATABRICKS_SQL_PATH=${DATABRICKS_SQL_PATH:-}
      - DATABRICKS_SQL_TOKEN=${DATABRICKS_SQL_TOKEN:-}
      - DATABRICKS_CATALOG=${DATABRICKS_CATALOG:-databricks_service_pf}
      - DATABRICKS_SCHEMA=${DATABRICKS_SCHEMA:-gold}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - cardiac

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cardiac-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cardiac

networks:
  cardiac:
    driver: bridge
